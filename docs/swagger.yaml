basePath: /api/v1
definitions:
  domain.Auth:
    properties:
      expiredAt:
        type: string
      id:
        type: string
      refreshTokenHash:
        type: string
      userID:
        type: string
    type: object
  domain.HttpResponse:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  dto.LoginRequestDTO:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginResponseDTO:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user_id:
        type: string
    type: object
  dto.LokasiParkirRequestDTO:
    properties:
      alamat:
        type: string
      isActive:
        type: boolean
      namaLokasi:
        type: string
      petugasID:
        type: string
    type: object
  dto.LokasiParkirResponseDTO:
    properties:
      alamat:
        type: string
      createdAt:
        type: string
      id:
        type: string
      isActive:
        type: boolean
      namaLokasi:
        type: string
      petugasID:
        type: string
      updatedAt:
        type: string
    type: object
  dto.OtpCodeRequestDTO:
    properties:
      telephone:
        type: string
    type: object
  dto.QRSessionResponseDTO:
    properties:
      expired_at:
        type: string
      hmac:
        type: string
      id:
        type: string
      is_revoked:
        type: boolean
      location_id:
        type: string
      payload:
        type: string
      petugas_id:
        type: string
    type: object
  dto.RefreshTokenRequestDTO:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegisterRequestDTO:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      telephone:
        type: string
    type: object
  dto.RegisterResponseDTO:
    properties:
      otp_sent_at:
        type: string
      telephone:
        type: string
      user_id:
        type: string
    type: object
  dto.TransaksiParkirRequestDTO:
    properties:
      jenis_kendaraan:
        type: string
      qr_payload:
        type: string
    required:
    - jenis_kendaraan
    - qr_payload
    type: object
  dto.TransaksiParkirResponseDTO:
    properties:
      id:
        type: string
      jenis_kendaraan:
        type: string
      kode_transaksi:
        type: string
      lokasi:
        $ref: '#/definitions/dto.LokasiParkirResponseDTO'
      petugas:
        $ref: '#/definitions/dto.UserResponseDTO'
      saldo_sebelum:
        type: integer
      saldo_sesudah:
        type: integer
      status:
        type: string
      tarif:
        type: integer
      waktu:
        type: string
    type: object
  dto.UserRequestDTO:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      telephone:
        type: string
    type: object
  dto.UserResponseDTO:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      name:
        type: string
      password:
        type: string
      role:
        type: string
      saldo:
        type: integer
      telephone:
        type: string
      updated_at:
        type: string
    type: object
  dto.UserSaldoRequestDTO:
    properties:
      nominal:
        type: integer
    type: object
  dto.VerifyOtpCodeRequestDTO:
    properties:
      otp_code:
        type: string
      telephone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is Parkin backend API
  title: Parkin API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Logout a user
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Auth'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      summary: Refresh access token
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.RegisterResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      summary: Register a new user
      tags:
      - auth
  /auth/resend-otp:
    post:
      consumes:
      - application/json
      parameters:
      - description: OTP Code Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OtpCodeRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      summary: Resend OTP code to user's telephone
      tags:
      - auth
  /auth/verify-register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Verify OTP Code Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyOtpCodeRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Auth'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      summary: Verify user registration
      tags:
      - auth
  /health:
    get:
      consumes:
      - application/json
      description: get server health
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Check server status
      tags:
      - health
  /lokasi-parkir:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.LokasiParkirResponseDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get all lokasi parkir
      tags:
      - lokasi-parkir
    post:
      consumes:
      - application/json
      parameters:
      - description: Create Lokasi Parkir Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LokasiParkirRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.LokasiParkirResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Create a new lokasi parkir
      tags:
      - lokasi-parkir
  /lokasi-parkir/{id}:
    delete:
      parameters:
      - description: Lokasi Parkir ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Delete lokasi parkir
      tags:
      - lokasi-parkir
    get:
      parameters:
      - description: Lokasi Parkir ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LokasiParkirResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get lokasi parkir by ID
      tags:
      - lokasi-parkir
    put:
      consumes:
      - application/json
      parameters:
      - description: Lokasi Parkir ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Lokasi Parkir Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LokasiParkirRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LokasiParkirResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Update lokasi parkir
      tags:
      - lokasi-parkir
  /lokasi-parkir/petugas/{petugas_id}:
    get:
      parameters:
      - description: Petugas ID
        in: path
        name: petugas_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LokasiParkirResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get lokasi parkir by Petugas ID
      tags:
      - lokasi-parkir
  /officer/qr-code:
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.QRSessionResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Create a new QR session for petugas
      tags:
      - qr-session
  /transaksi-parkir:
    post:
      consumes:
      - application/json
      description: Create a new parking transaction based on the provided QR payload
        and vehicle type
      parameters:
      - description: Transaksi Parkir Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.TransaksiParkirRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.TransaksiParkirResponseDTO'
      security:
      - BearerAuth: []
      summary: Create a new parking transaction
      tags:
      - Transaksi Parkir
  /transaksi-parkir/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve a parking transaction by its ID
      parameters:
      - description: Transaksi Parkir ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.TransaksiParkirResponseDTO'
      security:
      - BearerAuth: []
      summary: Get parking transaction by ID
      tags:
      - Transaksi Parkir
  /transaksi-parkir/user/me:
    get:
      consumes:
      - application/json
      description: Retrieve all parking transactions associated with a specific user
        ID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TransaksiParkirResponseDTO'
            type: array
      security:
      - BearerAuth: []
      summary: Get all parking transactions by user ID
      tags:
      - Transaksi Parkir
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserResponseDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: User Request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UserRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Create a new user
      tags:
      - users
  /users/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User Request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UserRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - users
  /users/me/saldo:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  format: int64
                  type: integer
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get user saldo
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User Saldo Request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UserSaldoRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Deduct user saldo
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
