basePath: /api/v1
definitions:
  domain.Auth:
    properties:
      expiredAt:
        type: string
      id:
        type: string
      refreshTokenHash:
        type: string
      userID:
        type: string
    type: object
  domain.HttpResponse:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  dto.AdminDashboardResponseDTO:
    properties:
      location_performance:
        items:
          $ref: '#/definitions/dto.LocationPerformanceDTO'
        type: array
      period_label:
        type: string
      range:
        type: string
      recent_transactions:
        items:
          $ref: '#/definitions/dto.AdminRecentTransactionDTO'
        type: array
      summary:
        $ref: '#/definitions/dto.AdminSummaryDTO'
      trend:
        items:
          $ref: '#/definitions/dto.AdminTrendDTO'
        type: array
    type: object
  dto.AdminFilterOptionsResponseDTO:
    properties:
      locations:
        items:
          $ref: '#/definitions/dto.FilterOptionItem'
        type: array
      officers:
        items:
          $ref: '#/definitions/dto.FilterOptionItem'
        type: array
      statuses:
        items:
          type: string
        type: array
      vehicles:
        items:
          type: string
        type: array
    type: object
  dto.AdminLocationDetailDTO:
    properties:
      alamat:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      nama_lokasi:
        type: string
      recent_history:
        items:
          $ref: '#/definitions/dto.TransaksiParkirResponseDTO'
        type: array
      total_pendapatan:
        type: integer
      total_transaksi:
        type: integer
    type: object
  dto.AdminOfficerDetailDTO:
    properties:
      email:
        type: string
      history_handled:
        items:
          $ref: '#/definitions/dto.TransaksiParkirResponseDTO'
        type: array
      id:
        type: string
      name:
        type: string
      telephone:
        type: string
      total_duty_days:
        type: integer
      total_tx_handled:
        type: integer
    type: object
  dto.AdminRecentTransactionDTO:
    properties:
      amount_rp:
        type: integer
      id:
        type: string
      location_name:
        type: string
      status:
        type: string
      time:
        type: string
      vehicle_type:
        type: string
    type: object
  dto.AdminReportResponseDTO:
    properties:
      average_per_tx:
        type: number
      breakdown_by_spot:
        items:
          $ref: '#/definitions/dto.ReportLocationBreakdown'
        type: array
      total_revenue:
        type: integer
      total_tx_global:
        type: integer
    type: object
  dto.AdminSummaryDTO:
    properties:
      active_locations:
        type: integer
      active_officers_today:
        type: integer
      mobil_count:
        type: integer
      motor_count:
        type: integer
      total_revenue_rp:
        type: integer
      total_transactions:
        type: integer
    type: object
  dto.AdminTrendDTO:
    properties:
      date:
        description: Format "YYYY-MM-DD"
        type: string
      label:
        description: 'Format hari: "Sen", "Sel", dst.'
        type: string
      revenue_rp:
        type: integer
      transaction_count:
        type: integer
    type: object
  dto.FilterOptionItem:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.LocationPerformanceDTO:
    properties:
      location_name:
        type: string
      officers_on_duty:
        description: Nama-nama petugas digabung string
        type: string
      revenue_today_rp:
        type: integer
      transactions_today:
        type: integer
    type: object
  dto.LoginRequestDTO:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.LoginResponseDTO:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user_id:
        type: string
    type: object
  dto.LokasiParkirRequestDTO:
    properties:
      alamat:
        type: string
      is_active:
        type: boolean
      nama_lokasi:
        type: string
      petugas_id:
        type: string
    required:
    - alamat
    - nama_lokasi
    - petugas_id
    type: object
  dto.LokasiParkirResponseDTO:
    properties:
      alamat:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      nama_lokasi:
        type: string
      petugas:
        $ref: '#/definitions/dto.UserResponseDTO'
    type: object
  dto.MidtransCallbackDTO:
    properties:
      gross_amount:
        type: string
      order_id:
        type: string
      payment_type:
        type: string
      signature_key:
        type: string
      status_code:
        type: string
      transaction_id:
        type: string
      transaction_status:
        type: string
      transaction_time:
        type: string
    type: object
  dto.OfficerDashboardResponseDTO:
    properties:
      alamat:
        type: string
      nama_lokasi:
        type: string
      nama_petugas:
        type: string
      total_mobil:
        type: integer
      total_motor:
        type: integer
      total_pendapatan:
        type: integer
      transactions:
        items:
          $ref: '#/definitions/dto.OfficerRecentTransactionDTO'
        type: array
    type: object
  dto.OfficerRecentTransactionDTO:
    properties:
      id:
        type: string
      jenis_kendaraan:
        type: string
      tarif:
        type: integer
      waktu:
        type: string
    type: object
  dto.OtpCodeRequestDTO:
    properties:
      telephone:
        type: string
    type: object
  dto.PaginatedTransactionResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/dto.TransaksiParkirResponseDTO'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  dto.QRSessionResponseDTO:
    properties:
      expired_at:
        type: string
      hmac:
        type: string
      id:
        type: string
      is_revoked:
        type: boolean
      lokasi_parkir:
        $ref: '#/definitions/dto.LokasiParkirResponseDTO'
      payload:
        type: string
    type: object
  dto.RefreshTokenRequestDTO:
    properties:
      refresh_token:
        type: string
    type: object
  dto.RegisterRequestDTO:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      telephone:
        type: string
    type: object
  dto.RegisterResponseDTO:
    properties:
      otp_sent_at:
        type: string
      telephone:
        type: string
      user_id:
        type: string
    type: object
  dto.ReportLocationBreakdown:
    properties:
      location_name:
        type: string
      revenue:
        type: integer
      total_tx:
        type: integer
    type: object
  dto.TopUpRequestDTO:
    properties:
      metode_pembayaran:
        type: string
      nominal:
        type: integer
    required:
    - metode_pembayaran
    - nominal
    type: object
  dto.TopUpResponseDTO:
    properties:
      id:
        type: string
      metodePembayaran:
        type: string
      midtransOrderID:
        type: string
      midtransTransactionID:
        type: string
      nominal:
        format: int64
        type: integer
      paidAt:
        type: string
      rawCallBack:
        type: string
      snapRedirectURL:
        type: string
      snapToken:
        type: string
      status:
        type: string
      user:
        $ref: '#/definitions/dto.UserResponseDTO'
    type: object
  dto.TransaksiParkirRequestDTO:
    properties:
      jenis_kendaraan:
        type: string
      qr_payload:
        type: string
    required:
    - jenis_kendaraan
    - qr_payload
    type: object
  dto.TransaksiParkirResponseDTO:
    properties:
      created_at:
        type: string
      id:
        type: string
      jenis_kendaraan:
        type: string
      kode_transaksi:
        type: string
      lokasi:
        $ref: '#/definitions/dto.LokasiParkirResponseDTO'
      pengguna:
        $ref: '#/definitions/dto.UserResponseDTO'
      saldo_sebelum:
        type: integer
      saldo_sesudah:
        type: integer
      status:
        type: string
      tarif:
        type: integer
    type: object
  dto.UserRequestDTO:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
      telephone:
        type: string
    type: object
  dto.UserResponseDTO:
    properties:
      email:
        type: string
      id:
        type: string
      is_verified:
        type: boolean
      lokasi:
        $ref: '#/definitions/dto.LokasiParkirResponseDTO'
      name:
        type: string
      password:
        type: string
      role:
        type: string
      saldo:
        type: integer
      telephone:
        type: string
    type: object
  dto.VerifyOtpCodeRequestDTO:
    properties:
      otp_code:
        type: string
      telephone:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is Parkin backend API
  title: Parkin API
  version: "1.0"
paths:
  /admin/dashboard:
    get:
      consumes:
      - application/json
      description: Retrieve global analytics, trend metrics, recent streams, and spot
        performance using fast Go-runtime mapping
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminDashboardResponseDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Get Admin Dashboard Analytics
      tags:
      - admin
  /admin/locations:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all parking spots/locations with their assigned
        officers
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.LokasiParkirResponseDTO'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Get All Parking Locations
      tags:
      - admin
  /admin/locations/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve detailed statistics and recent transaction history for
        a specific parking spot
      parameters:
      - description: Location UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminLocationDetailDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Get Location Detail & Stats
      tags:
      - admin
  /admin/lokasi-parkir:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.LokasiParkirResponseDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get all lokasi parkir
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Create Lokasi Parkir Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LokasiParkirRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.LokasiParkirResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Create a new lokasi parkir
      tags:
      - admin
  /admin/lokasi-parkir/{id}:
    delete:
      parameters:
      - description: Lokasi Parkir ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Delete lokasi parkir
      tags:
      - admin
    get:
      parameters:
      - description: Lokasi Parkir ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LokasiParkirResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get lokasi parkir by ID
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: Lokasi Parkir ID
        in: path
        name: id
        required: true
        type: string
      - description: Update Lokasi Parkir Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LokasiParkirRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LokasiParkirResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Update lokasi parkir
      tags:
      - admin
  /admin/lokasi-parkir/petugas/{petugas_id}:
    get:
      parameters:
      - description: Petugas ID
        in: path
        name: petugas_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LokasiParkirResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get lokasi parkir by Petugas ID
      tags:
      - admin
  /admin/officers:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all parking officers/dishub personnel
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.UserResponseDTO'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: Get All Field Officers
      tags:
      - admin
  /admin/officers/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve specific officer's duty performance and recent handled
        transactions
      parameters:
      - description: Officer UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminOfficerDetailDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Get Officer Performance Detail
      tags:
      - admin
  /admin/reports:
    get:
      consumes:
      - application/json
      description: Retrieve high-level financial reports with optional filters for
        business insights
      parameters:
      - description: 'Format: YYYY-MM-DD'
        in: query
        name: date_from
        type: string
      - description: 'Format: YYYY-MM-DD'
        in: query
        name: date_to
        type: string
      - description: Filter by specific spot
        in: query
        name: location_id
        type: string
      - description: motor / mobil
        in: query
        name: vehicle
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminReportResponseDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Get Aggregate Revenue Report
      tags:
      - admin
  /admin/transactions:
    get:
      consumes:
      - application/json
      description: Retrieve global parking logs with rich analytical multi-filters
        for admin monitoring
      parameters:
      - description: 'Format: YYYY-MM-DD'
        in: query
        name: date_from
        type: string
      - description: 'Format: YYYY-MM-DD'
        in: query
        name: date_to
        type: string
      - description: Filter by Spot UUID
        in: query
        name: location_id
        type: string
      - description: Filter by Officer UUID
        in: query
        name: officer_id
        type: string
      - description: motor / mobil
        in: query
        name: vehicle
        type: string
      - description: sukses / gagal
        in: query
        name: status
        type: string
      - description: Page indicator
        in: query
        name: page
        type: integer
      - description: Row window scale
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.PaginatedTransactionResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Global Transaction Monitoring
      tags:
      - admin
  /admin/transactions/{id}:
    get:
      description: Get precise logs data with strict masked user security patterns
      parameters:
      - description: Transaction UUID
        in: path
        name: id
        required: true
        type: string
      responses: {}
      security:
      - BearerAuth: []
      summary: Transaction Audit Audit (Masked ID)
      tags:
      - admin
  /admin/transactions/filter-options:
    get:
      consumes:
      - application/json
      description: Retrieve dynamic dropdown options for admin transaction monitoring
        filter (locations, officers, vehicles, statuses)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HttpResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AdminFilterOptionsResponseDTO'
              type: object
      security:
      - BearerAuth: []
      summary: Get Transaction Filter Options
      tags:
      - admin
  /admin/user:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.UserResponseDTO'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get all users
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: User Request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UserRequestDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.UserResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Create a new user
      tags:
      - admin
  /admin/user/{id}:
    delete:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - admin
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Get user by ID
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: User Request
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/dto.UserRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.UserResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      security:
      - BearerAuth: []
      summary: Update user
      tags:
      - admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponseDTO'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.HttpResponse'
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh Token Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenRequestDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.HttpResponse'
        "401":
